name: golf_swing_analyzer
description: ゴルフスイング練習アプリ
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6
  camera: ^0.12.0+1
  video_player: ^2.11.1
  google_fonts: ^8.1.0
  video_thumbnail: ^0.5.6
  image: ^4.9.1
  easy_video_editor: ^0.1.6
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  build_runner: ^2.15.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png"
  adaptive_icon_foreground_inset: 0
